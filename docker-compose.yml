version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    container_name: psiem_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - psiem-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.1
    container_name: psiem_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://psiem_elasticsearch:9200
      - SERVER_HOST=0.0.0.0
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true 
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.1
    container_name: psiem_logstash
    ports:
      - "5044:5044"
    volumes:
      - ./logs/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.1
    container_name: psiem_filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/suricata:/var/log/suricata:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
      - elasticsearch
    networks:
      - psiem-net
    command: filebeat -e -strict.perms=false

  ids:
    build: ./ids
    container_name: psiem_ids
    volumes:
      - ./ids/rules:/etc/suricata/rules
      - ./logs/suricata:/var/log/suricata
    depends_on:
      - elasticsearch
    networks:
      - psiem-net
    cap_add:
      - NET_ADMIN
      - NET_RAW

  react-dashboard:
    build: ./dashboard
    container_name: psiem_react_dashboard
    depends_on:
      - elasticsearch
      - logstash
    networks:
      - psiem-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: psiem_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - psiem-net

  nginx:
    image: nginx:alpine
    container_name: psiem_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro 
    depends_on:
      - kibana
      - keycloak
    networks:
      - psiem-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: psiem_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - psiem-net

  password-manager:
    build: ./password-manager
    container_name: psiem_password_manager
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  ai-assistant:
    build: ./ai-assistant
    container_name: psiem_ai_assistant
    depends_on:
      - elasticsearch
      - react-dashboard
    networks:
      - psiem-net

volumes:
  es_data:
  filebeat_data:

networks:
  psiem-net:
    driver: bridge

