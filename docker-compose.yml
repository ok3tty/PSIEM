version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    container_name: psiem_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - psiem-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.1
    container_name: psiem_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://psiem_elasticsearch:9200
      - SERVER_HOST=0.0.0.0
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.1
    container_name: psiem_logstash
    ports:
      - "5044:5044"
      - "5045:5045"
      - "5140:5140/udp"
      - "5140:5140/tcp"
    volumes:
      - ./logs/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.1
    container_name: psiem_filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/suricata:/var/log/suricata:ro
      - ./logs/zeek/spool/zeek:/var/log/zeek/live:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
      - elasticsearch
    networks:
      - psiem-net
    command: filebeat -e -strict.perms=false

  ids:
    build: ./ids
    container_name: psiem_ids
    volumes:
      - ./ids/rules:/etc/suricata/rules
      - ./logs/suricata:/var/log/suricata
      - ./logs/zeek/spool/zeek:/var/log/zeek/live
    depends_on:
      - elasticsearch
    networks:
      - psiem-net
    cap_add:
      - NET_ADMIN
      - NET_RAW

  zeek:
    image: zeek/zeek:6.0
    container_name: psiem_zeek
    network_mode: host
    volumes:
      - ./logs/zeek:/usr/local/zeek/logs
      - ./logs/zeek/spool:/usr/local/zeek/spool
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./zeek/node.cfg:/usr/local/zeek/etc/node.cfg:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    command: sh -c "zeekctl deploy && sleep infinity"

  react-dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_ELASTICSEARCH_URL=/elasticsearch
        - VITE_AI_ASSISTANT_URL=https://myaegis.org/ai-assistant/
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: psiem_react_dashboard
    ports:
      - "3000:80"
    depends_on:
      - elasticsearch
      - logstash
    networks:
      - psiem-net

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: psiem_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - psiem-net

  nginx:
    image: nginx:alpine
    container_name: psiem_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - kibana
      - keycloak
    networks:
      - psiem-net
    restart: unless-stopped

  password-manager:
    build: ./password-manager
    container_name: psiem_password_manager
    depends_on:
      - elasticsearch
    networks:
      - psiem-net

  ai-assistant:
    build: ./ai-assistant
    container_name: psiem_ai_assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - elasticsearch
      - react-dashboard
    networks:
      - psiem-net

  prometheus:
    image: prom/prometheus:latest
    container_name: psiem_prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=https://myaegis.org/prometheus/'
      - '--web.route-prefix=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - psiem-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: psiem_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=myaegis.org
      - GF_SERVER_ROOT_URL=https://myaegis.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SESSION_PROVIDER=file
      - GF_SESSION_LIFE_TIME=86400
      - GF_USERS_DEFAULT_THEME=dark
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=true
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DATASOURCES_DEFAULT_ACCESS_MODE=proxy
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=psiemaeg1s@gmail.com
      - GF_SMTP_PASSWORD=jxoklzgfeuyzmzja
      - GF_SMTP_FROM_ADDRESS=psiemaeg1s@gmail.com
      - GF_SMTP_FROM_NAME=AEGIS SIEM
    networks:
      - psiem-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: psiem_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - psiem-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: psiem_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - psiem-net

volumes:
  es_data:
  filebeat_data:
  prometheus_data:
  grafana_data:

networks:
  psiem-net:
    driver: bridge
