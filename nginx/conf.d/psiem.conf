# Main dashboard - default route
server {
    listen 80;
    server_name localhost;

    # Increase buffer sizes for large headers (needed for Keycloak)
    large_client_header_buffers 4 32k;
    client_max_body_size 10M;

    # Root - Redirect to Kibana until dashboard is ready
#    location = / {
 #       return 302 /kibana/;
  #  }

    # Placeholder for future dashboard
 #   location / {
#        return 503 "Dashboard coming soon. Please visit /kibana/ or /keycloak/";
#        add_header Content-Type text/plain;
#    }


    # Root - React Dashboard
   location / {
        proxy_pass http://psiem_react_dashboard:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Kibana
    location /kibana/ {
        proxy_pass http://psiem_kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Keycloak
    location /keycloak/ {
        proxy_pass http://psiem_keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        
        # Important for Keycloak
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Elasticsearch API (optional - for dashboard to query directly)
    location /elasticsearch/ {
        rewrite ^/elasticsearch/(.*)$ /$1 break;
        proxy_pass http://psiem_elasticsearch:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
